services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: roast-api:local
    environment: &api-env
      DATABASE_URL: postgresql://roast:roast@db:5432/roast
    command: ["node", "apps/api/dist/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: roast-api:local
    environment:
      <<: *api-env
      TRUST_PROXY: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
